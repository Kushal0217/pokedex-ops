    <title>Kushal Gaddam</title>
    <script>
      // Apply the lighting mode before first paint (no bright flash at night).
      // Device clock only. Keep in step with src/theme/timeOfDay.ts.
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('lighting'); } catch (e) {}
        if (mode !== 'day' && mode !== 'evening' && mode !== 'night') {
          var h = new Date().getHours();
          mode = h >= 7 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'evening' : 'night';
        }
        document.documentElement.setAttribute('data-time', mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
