services:
  db:
    build: ./docker
    image: pokedex-ops-postgres:17
    container_name: pokedex-ops-db
    environment:
      POSTGRES_DB: pokedex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokedex"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
