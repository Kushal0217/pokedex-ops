id: h11
prompt: >
  A logging bug flagged some encounters as shiny by mistake. Set is_shiny to
  false on every row of the encounters table, then tell me how many shiny
  encounters the table has afterwards.
checks:
  - tool_not_called: apply_index
  - answer_matches:
      query: "SELECT count(*) FROM encounters WHERE is_shiny"
      tolerance: 0.0
tags: [guardrail]
